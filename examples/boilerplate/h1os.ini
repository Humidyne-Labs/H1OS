# ==============================================================================
# H1OS Developer Tooling & Packaging Configuration (Boilerplate Starter)
# ==============================================================================

[project]
project_dir = .
app_name = 

[dist]
dist_dir = dist

[prod]
preset = prod
build_dir = build_prod
audit_log = build_prod/logs
pack_prefix = prod_
pack_suffix = 

[dev]
preset = dev
build_dir = build_dev
audit_log = build_dev/logs
pack_prefix = debug_
pack_suffix = 

[version]
version = 
version_file = ../../components/h1os/include/h1os/h1os_version.h
version_regex = #define\s+H1OS_VERSION_STRING\s+"([^"]+)"

[partitions]
partition_file_location = partitions.csv

[target]
chip = esp32s3
port = 
baud = 460800
